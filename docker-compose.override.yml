# Dev overrides — Docker Compose merges this automatically with docker-compose.yml.
# Replaces the built Nginx frontend with a Vite dev server that hot-reloads on save.
#
# Usage:
#   docker-compose up --build       # first run, or after adding a new npm package
#   docker-compose up               # subsequent runs (no rebuild needed)
#
# Frontend available at: http://localhost:5173  (with HMR)
# Backend API at:        http://localhost:8000  (exposed for tools / curl)

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:4173,http://localhost:5173"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      BACKEND_URL: http://backend:8000
